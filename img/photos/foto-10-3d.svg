<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <!-- Иллюстрация «3D» для блока шоурума: изометрический куб-комната, сетка пола, орбита вращения. Без товара. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2e38"/>
      <stop offset="1" stop-color="#16171c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="45%">
      <stop offset="0" stop-color="#b8976e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b8976e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede4"/>
      <stop offset="1" stop-color="#d9cdbd"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b79f"/>
      <stop offset="1" stop-color="#9a7a55"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6d4b"/>
      <stop offset="1" stop-color="#5e4a34"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#e9dcc9"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <!-- изометрическая сетка пола -->
  <g stroke="#e9dcc9" stroke-opacity=".10" stroke-width="1.5">
    <path d="M600 1180 L1180 845 M520 1134 L1100 799 M440 1088 L1020 753 M360 1042 L940 707 M280 996 L860 661 M200 950 L780 615 M120 904 L700 569 M40 858 L620 523"/>
    <path d="M600 1180 L20 845 M680 1134 L100 799 M760 1088 L180 753 M840 1042 L260 707 M920 996 L340 661 M1000 950 L420 615 M1080 904 L500 569 M1160 858 L580 523"/>
  </g>

  <!-- тень под кубом -->
  <ellipse cx="600" cy="850" rx="300" ry="70" fill="#000" opacity=".35"/>

  <!-- куб: три грани -->
  <g stroke="#f4ede4" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round">
    <path d="M600 330 L860 480 L600 630 L340 480 Z" fill="url(#top)"/>
    <path d="M340 480 L600 630 L600 900 L340 750 Z" fill="url(#left)"/>
    <path d="M860 480 L600 630 L600 900 L860 750 Z" fill="url(#right)"/>
  </g>
  <!-- рельеф на гранях: панели -->
  <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2">
    <path d="M380 540 L560 644 L560 840 L380 736 Z"/>
    <path d="M820 540 L640 644 L640 840 L820 736 Z"/>
    <path d="M600 380 L775 480 L600 581 L425 480 Z"/>
  </g>

  <!-- каркас-призрак (вид после поворота) -->
  <g fill="none" stroke="#e9dcc9" stroke-opacity=".28" stroke-width="2" stroke-dasharray="8 10">
    <path d="M600 300 L900 420 L700 640 L400 520 Z"/>
    <path d="M400 520 L400 790 L700 910 L700 640 M900 420 L900 690 L700 910 M600 300 L600 570"/>
  </g>

  <!-- орбита вращения со стрелками -->
  <g fill="none" stroke="#e9dcc9" stroke-width="3" stroke-linecap="round">
    <path d="M190 640 A410 140 0 0 0 1010 640" marker-end="url(#arr)"/>
    <path d="M1010 600 A410 140 0 0 0 190 600" stroke-opacity=".35" stroke-dasharray="4 14" marker-end="url(#arr)"/>
  </g>

  <!-- метки -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e9dcc9" text-anchor="middle">
    <text x="600" y="190" font-size="120" letter-spacing="8">3D</text>
    <text x="600" y="1060" font-size="44" letter-spacing="10" fill-opacity=".75">360°</text>
  </g>
  <circle cx="600" cy="225" r="0" fill="none"/>
</svg>
