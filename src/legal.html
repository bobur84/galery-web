<!doctype html>
<!-- Каркас юридической страницы (политика, условия). Сам текст документа лежит
     в web/legal/<документ>.<язык>.html и подставляется ниже по тексту.
     ВНИМАНИЕ: не писать здесь ключи в двойных фигурных скобках — сборка подставит
     их и внутри комментария, разорвав разметку страницы. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.desc}}">
<meta name="theme-color" content="#c39a6b">
<!-- юридические страницы в поиске не нужны, но индексация ссылок с них — да -->
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<link rel="stylesheet" href="/css/home.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%232b2622'/><text y='72' x='50' text-anchor='middle' font-size='66' font-family='Georgia,serif' fill='%23c39a6b'>G</text></svg>">
</head>
<body class="legal-page">
<script>document.documentElement.classList.add('js')</script>

{{site_header}}

<main id="main">
  <section class="lg-hero">
    <div class="wrap">
      <p class="crumbs"><a href="/{{lang}}/">{{legal.back}}</a><span>/</span>{{legal.eyebrow}}</p>
      <h1>{{page.h1}}</h1>
      <p class="legal-updated">{{legal.updated_label}}: {{co.updated}}</p>
    </div>
  </section>
  <section class="legal">
    <div class="wrap legal-in">
      {{legal_body}}
      <p class="legal-back"><a href="/{{lang}}/" class="btn btn-line">← {{legal.back}}</a></p>
    </div>
  </section>
</main>

{{site_footer}}

<script src="/js/site.js"></script>
</body>
</html>
