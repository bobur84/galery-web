<footer class="footer">
  <div class="wrap footer-in">
    <div>
      <a href="/{{lang}}/" class="logo logo-light"><span class="logo-mark">G</span><span class="logo-txt"><b>Galereya Best</b><small>{{hero.eyebrow}}</small></span></a>
      <p class="foot-txt">{{foot.txt}}</p>
    </div>
    <nav class="foot-links">
      <a href="/{{lang}}/#catalog">{{nav.catalog}}</a>
      <a href="/{{lang}}/#brands">{{nav.brands}}</a>
      <a href="/{{lang}}/#services">{{nav.services}}</a>
      <a href="/{{lang}}/#about">{{nav.about}}</a>
      <a href="/{{lang}}/#contacts">{{nav.contacts}}</a>
      <a href="/{{lang}}/privacy/">{{legal.privacy_short}}</a>
      <a href="/{{lang}}/terms/">{{legal.terms_short}}</a>
    </nav>
    <nav class="foot-links foot-dirs">
      {{dir_strip}}
    </nav>
    <div class="foot-staff">
      <a href="https://office.galery.uz" class="btn btn-line-light btn-sm">{{foot.staff_btn}}</a>
      <p class="foot-note">{{foot.staff_note}}</p>
    </div>
  </div>
  <div class="wrap copyright">
    <span>© <span id="yr">2026</span> Galereya Best. {{foot.rights}}</span>
  </div>
</footer>
