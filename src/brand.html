<!doctype html>
<!-- Каталог бренда (образец для всех брендов): шапка бренда, фильтры, карточки товаров, окно товара. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.desc}}">
<meta name="theme-color" content="#161616">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<link rel="stylesheet" href="/css/home.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23161616'/><text y='72' x='50' text-anchor='middle' font-size='66' font-family='Georgia,serif' fill='%23b8976e'>G</text></svg>">
</head>
<body class="bk">
<script>document.documentElement.classList.add('js')</script>

{{site_header}}

<main id="main">
<!-- 1) ШАПКА БРЕНДА: текст слева, фото справа (ФОТО 31) -->
<section class="bk-hero">
  <div class="bk-hero-txt">
    <p class="crumbs"><a href="/{{lang}}/">{{legal.back}}</a><span>/</span><a href="/{{lang}}/plintusy/">{{cat.c1_t}}</a><span>/</span>TRIMLINE</p>
    <p class="eyebrow">{{bk.eye}}</p>
    <h1>TRIMLINE</h1>
    <p class="lead">{{bk.lead}}</p>
    <div class="bk-stats">
      <div><b id="st-all">0</b><span>{{bk.s_all}}</span></div>
      <div><b id="st-in">0</b><span>{{bk.s_in}}</span></div>
      <div><b>2400 {{unit.mm}}</b><span>{{bk.s_len}}</span></div>
    </div>
    <!-- Ссылка на 3D-шоурум — только у брендов, где он есть -->
    <a class="btn btn-dark" href="/{{lang}}/3d/">{{bk.showroom}} →</a>
  </div>
  <div class="bk-hero-img">{{ph.31}}</div>
</section>

<!-- 2) ФИЛЬТРЫ -->
<div class="bk-bar">
  <div class="wrap bk-bar-in">
    <div class="bk-tabs" id="tabs">
      <button class="bk-tab on" data-cat="all">{{bk.all}}</button>
      <button class="bk-tab" data-cat="moulding">{{bk.t_moulding}}</button>
      <button class="bk-tab" data-cat="panel">{{bk.t_panel}}</button>
      <button class="bk-tab" data-cat="plinth">{{bk.t_plinth}}</button>
      <button class="bk-tab" data-cat="cornice">{{bk.t_cornice}}</button>
    </div>
    <div class="bk-tools">
      <input class="bk-search" id="q" type="search" placeholder="{{bk.search}}" aria-label="{{bk.search}}">
      <label class="bk-only"><input type="checkbox" id="only"> {{bk.only}}</label>
      <span class="bk-count" id="count" data-of="{{bk.of}}"></span>
    </div>
  </div>
</div>

<!-- 3) КАРТОЧКИ ТОВАРОВ -->
<section class="bk-list">
  <div class="wrap">
    <div class="bk-grid" id="grid" data-hit="{{bk.hit}}" data-in="{{bk.in}}" data-out="{{bk.out}}" data-photo="{{bk.photo}}" data-draw="{{bk.draw}}"></div>
    <p class="bk-empty" id="empty">{{bk.empty}}</p>
  </div>
</section>

<!-- ТОВАРЫ — ПРИМЕР. Список собирает build.py (PRODUCTS), фото — из photos.json.
     В реальном каталоге товары, остатки и фото подставляются со склада. -->
<ul id="items" hidden>
  {{bk_items}}
</ul>
</main>

<!-- 4) ОКНО ТОВАРА -->
<div class="bk-modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-t">
  <div class="bk-box">
    <button class="bk-x" id="m-x" aria-label="{{bk.close}}">×</button>
    <div class="bk-pics">
      <div class="bk-pic" id="m-photo"></div>
      <div class="bk-pic bk-pic-draw" id="m-draw"></div>
    </div>
    <div class="bk-det">
      <p class="eyebrow">TRIMLINE</p>
      <h2 id="m-t"></h2>
      <p class="bk-sub" id="m-sub"></p>
      <p class="d" id="m-d"></p>
      <table class="bk-tbl"><tbody id="m-tbl" data-code="{{bk.f_code}}" data-name="{{bk.f_name}}" data-size="{{bk.f_size}}" data-len="{{bk.f_len}}" data-stock="{{bk.f_stock}}" data-in="{{bk.st_in}}" data-out="{{bk.st_out}}"></tbody></table>
      <div class="bk-acts">
        <a class="btn btn-dark" href="/{{lang}}/#contacts">{{bk.req}}</a>
        <a class="btn btn-line" href="/{{lang}}/3d/">{{bk.view3d}}</a>
      </div>
      <p class="bk-note">{{bk.note}}</p>
    </div>
  </div>
</div>

{{site_footer}}

<script src="/js/site.js"></script>
<script>
/* Товары берутся из списка #items выше (в реальном каталоге — со склада). */
var G=document.getElementById('grid'), TB=document.getElementById('m-tbl');
var ITEMS=[].map.call(document.querySelectorAll('#items li'),function(li){
  return {code:li.dataset.code, cat:li.dataset.cat, size:li.dataset.size, len:li.dataset.len,
          stock:li.dataset.stock, hit:li.dataset.hit==="1", photo:li.dataset.photo||"", crop:li.dataset.crop||"",
          ph:li.dataset.ph, phdesc:li.dataset.desc, profile:li.dataset.profile||"",
          name:li.querySelector('.n').textContent, desc:li.querySelector('.d').textContent};
});
/* Схема профиля по типу — пока нет настоящего чертежа */
var ICON = {
  moulding:'<path d="M20 10 L60 10 L60 30 Q80 40 80 50 Q80 60 60 70 L60 90 L20 90 Z"/>',
  panel:'<path d="M15 10 L15 90 M35 10 L35 90 M55 10 L55 90 M75 10 L75 90 M15 10 L85 10 M15 90 L85 90"/>',
  plinth:'<path d="M20 90 L20 10 L45 10 L45 40 Q60 45 70 60 L80 60 L80 90 Z"/>',
  cornice:'<path d="M15 15 L85 15 L85 30 Q60 35 50 55 Q40 75 30 80 L15 85 Z"/>'
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(it){ return '<svg class="prof-svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true">'+ICON[it.cat]+'</svg>'; }
/* Фото товара: файл из photos.json или подписанная заглушка «ФОТО M21» */
function photo(it){
  if (it.photo) return '<figure class="ph has-img"><img src="'+esc(it.photo)+'" alt="'+esc(it.name)+'"'+(it.crop?' class="crop-'+esc(it.crop)+'"':'')+' loading="lazy"></figure>';
  return '<figure class="ph"><figcaption class="ph-cap"><b>ФОТО '+esc(it.ph)+'</b><span>'+esc(it.phdesc)+'</span></figcaption></figure>';
}
var cat="all";
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase(), only=document.getElementById('only').checked;
  var list=ITEMS.filter(function(it){
    return (cat==="all"||it.cat===cat) && (!only||it.stock==="1") &&
      (!q || (it.code+" "+it.name+" "+it.size).toLowerCase().indexOf(q)>-1);
  });
  G.innerHTML=list.map(function(it){
    var type=it.name.split(' · ')[1]||'';
    return '<button class="bk-card" data-i="'+ITEMS.indexOf(it)+'">'+
      '<div class="pc-img">'+photo(it)+(it.photo?'':'<span class="pc-prof">'+draw(it)+'</span>')+
      (it.hit?'<span class="pc-hit">'+esc(G.dataset.hit)+'</span>':'')+'</div>'+
      '<div class="pc-b"><span class="pc-code">'+esc(it.code)+'<i>|</i>'+esc(type)+'</span>'+
      '<span class="pc-size">'+esc(it.size)+' · '+esc(it.len)+'</span>'+
      (it.stock?'<span class="pc-stock '+(it.stock==='1'?'in':'out')+'">'+esc(it.stock==='1'?G.dataset.in:G.dataset.out)+'</span>':'')+'</div></button>';
  }).join('');
  var c=document.getElementById('count');
  c.textContent=c.dataset.of.replace('{n}',list.length).replace('{m}',ITEMS.length);
  document.getElementById('empty').style.display=list.length?'none':'block';
}
document.getElementById('st-all').textContent=ITEMS.length;
document.getElementById('st-in').textContent=ITEMS.filter(function(x){return x.stock==="1"}).length;
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.bk-tab'); if(!b) return;
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)}); cat=b.dataset.cat; render();
});
document.getElementById('q').addEventListener('input',render);
document.getElementById('only').addEventListener('change',render);

/* окно товара */
var modal=document.getElementById('modal'), last=null;
G.addEventListener('click',function(e){
  var c=e.target.closest('.bk-card'); if(!c) return; last=c;
  var it=ITEMS[+c.dataset.i], L=TB.dataset;
  document.getElementById('m-t').textContent=it.code;
  document.getElementById('m-sub').textContent=it.name;
  document.getElementById('m-d').textContent=it.desc;
  document.getElementById('m-photo').innerHTML=photo(it)+'<span>'+esc(G.dataset.photo)+'</span>';
  /* чертёж: настоящий (profile) или схема — только пока нет фото */
  var md=document.getElementById('m-draw'); md.hidden=!!(it.photo&&!it.profile);
  md.innerHTML=(it.profile?'<img src="'+esc(it.profile)+'" alt="">':draw(it))+'<span>'+esc(G.dataset.draw)+'</span>';
  var rows=[[L.code,it.code],[L.name,it.name],[L.size,it.size],[L.len,it.len]];
  if(it.stock) rows.push([L.stock,it.stock==='1'?L.in:L.out]);
  TB.innerHTML=rows
    .map(function(r){return '<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>'}).join('');
  modal.classList.add('open'); document.getElementById('m-x').focus();
});
function closeM(){modal.classList.remove('open'); if(last) last.focus();}
document.getElementById('m-x').addEventListener('click',closeM);
modal.addEventListener('click',function(e){if(e.target===modal) closeM();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('open')) closeM();});
/* поиск с главной: /trimline/?q=M21 */
var q0=new URLSearchParams(location.search).get('q');
if(q0) document.getElementById('q').value=q0;
render();
</script>
</body>
</html>
