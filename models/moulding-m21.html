function sampleProfile(){return PROFILE}
function prep(P){
 let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1]}
 const pp=(a<0?P.slice().reverse():P.slice()).map(p=>[p[0]+OFF,p[1]]);
 const k=pp.length,e=[];
 for(let i=0;i<k;i++){const p=pp[i],q=pp[(i+1)%k],dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;e.push([dy/l,-dx/l])}

/* V — точки пути на поверхности стены [x,z], Nrm — наружные нормали сегментов [x,z] */
function buildMold(P,V,Nrm,y0){
 const pr=prep(P),pp=pr.pts,k=pr.n,ns=Nrm.length,out=[],tris=ear(pp);
 const mv=[];
 for(let i=0;i<=ns;i++){
  if(i===0)mv.push(Nrm[0]);
  else if(i===ns)mv.push(Nrm[ns-1]);
  else{const a=Nrm[i-1],b=Nrm[i],f=1+a[0]*b[0]+a[1]*b[1];mv.push([(a[0]+b[0])/f,(a[1]+b[1])/f])}}
 const rings=mv.map((m,i)=>pp.map(p=>[V[i][0]+p[0]*m[0],y0+p[1],V[i][1]+p[0]*m[1]]));
 for(let s=0;s<ns;s++){
  const pos=[],nor=[],idx=[],N=Nrm[s],R0=rings[s],R1=rings[s+1];
  const nn=q=>[q[0]*N[0],q[1],q[0]*N[1]];
  for(let e=0;e<k;e++){const i=e,j=(e+1)%k,b=pos.length/3;
   pos.push(...R0[i],...R0[j],...R1[i],...R1[j]);
   const na=nn(pr.vv(i,e)),nb=nn(pr.vv(j,e));
   nor.push(...na,...nb,...na,...nb);
   idx.push(b,b+1,b+2,b+1,b+3,b+2)}
  const nS=idx.length;
  let dx=V[s+1][0]-V[s][0],dz=V[s+1][1]-V[s][1];const dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;
  const cap=(Rg,sg)=>tris.forEach(t=>{const b=pos.length/3;t.forEach(i=>{pos.push(...Rg[i]);nor.push(sg*dx,0,sg*dz)});idx.push(b,b+1,b+2)});

  if(s===ns-1)cap(R1,1);
  for(let t=0;t<idx.length;t+=3){const a=idx[t],b=idx[t+1],c=idx[t+2];const ux=pos[b*3]-pos[a*3],uy=pos[b*3+1]-pos[a*3+1],uz=pos[b*3+2]-pos[a*3+2],vx=pos[c*3]-pos[a*3],vy=pos[c*3+1]-pos[a*3+1],vz=pos[c*3+2]-pos[a*3+2];const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nx*nor[a*3]+ny*nor[a*3+1]+nz*nor[a*3+2]<0){idx[t+1]=c;idx[t+2]=b}}

  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
