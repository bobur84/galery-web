<style>
:root{--bg:#fff;--fg:#1c1c1e;--line:#d8d8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1e20;--fg:#f2f2f4;--line:#3a3a3e}}
:root[data-theme="dark"]{--bg:#1e1e20;--fg:#f2f2f4;--line:#3a3a3e}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
#view{flex:1;min-height:0;position:relative;touch-action:none;cursor:grab}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:13px;color:#333;opacity:.7;pointer-events:none}
#bar{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.grp b{font-size:13px;font-weight:600;margin-right:4px}
.pill{border:1px solid var(--line);background:none;color:var(--fg);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--fg);color:var(--bg)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--fg);outline-offset:2px}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
</style>

const PW=2.175,PH=4.929; // панель масштабируется до высоты PH
const K=2; // стена больше панели в K раз по каждой стороне (площадь ×4)
const WW=PW*K,WH=PH*K,WT=0.5;

// стена (свободно стоит)
// реалистичная штукатурка: процедурная текстура (пятна, мелкое зерно, штрихи шпателя), окрашивается выбранным цветом
function plasterTex(){
  const cw=512,ch=1024,c=document.createElement('canvas');c.width=cw;c.height=ch;
  const x=c.getContext('2d');
  x.fillStyle='#f8f8f8';x.fillRect(0,0,cw,ch);
  for(let i=0;i<160;i++){
    const px=Math.random()*cw,py=Math.random()*ch,r=40+Math.random()*150,v=Math.random()<.5?0:255;
    const gr=x.createRadialGradient(px,py,0,px,py,r);
    gr.addColorStop(0,`rgba(${v},${v},${v},0.12)`);gr.addColorStop(1,`rgba(${v},${v},${v},0)`);
    x.fillStyle=gr;x.fillRect(px-r,py-r,2*r,2*r);
  }
  x.lineCap='round';
  for(let i=0;i<70;i++){
    const v=Math.random()<.5?0:255;
    x.strokeStyle=`rgba(${v},${v},${v},0.06)`;x.lineWidth=8+Math.random()*26;
    const sx=Math.random()*cw,sy=Math.random()*ch,a=Math.random()*Math.PI;
    x.beginPath();x.moveTo(sx,sy);
    x.quadraticCurveTo(sx+Math.cos(a)*60,sy+Math.sin(a)*60+30,sx+Math.cos(a)*140,sy+Math.sin(a)*140);x.stroke();
  }
  const im=x.getImageData(0,0,cw,ch),d=im.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*26;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  x.putImageData(im,0,0);
  // живой тон: светлее сверху, темнее к полу, мягкое затемнение по краям
  const vg=x.createLinearGradient(0,0,0,ch);
  vg.addColorStop(0,'rgba(255,255,255,0.10)');vg.addColorStop(.6,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.22)');
  x.fillStyle=vg;x.fillRect(0,0,cw,ch);
  const eg=x.createRadialGradient(cw/2,ch/2,ch*.25,cw/2,ch/2,ch*.75);
  eg.addColorStop(0,'rgba(0,0,0,0)');eg.addColorStop(1,'rgba(0,0,0,0.12)');
  x.fillStyle=eg;x.fillRect(0,0,cw,ch);
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=8;return t;
}
const wallMat=new THREE.MeshStandardMaterial({color:0x8b8e93,roughness:.95});
const wall=new THREE.Mesh(new THREE.BoxGeometry(WW,WH,WT),wallMat);
wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xdcdde0,roughness:1}));
floor.rotation.x=-Math.PI/2;floor.position.y=-WH/2;floor.receiveShadow=true;scene.add(floor);

// загрузка STL (бинарный): STL x -> ширина, z -> высота, y -> вперёд
function buildPanel(b64){
  const bin=atob(b64),len=bin.length,buf=new ArrayBuffer(len),u8=new Uint8Array(buf);
  for(let i=0;i<len;i++)u8[i]=bin.charCodeAt(i);
  const dv=new DataView(buf),n=dv.getUint32(80,true);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,z0=1e9,z1=-1e9;
  for(let t=0;t<n;t++)for(let k=0;k<3;k++){
    const o=84+t*50+12+k*12,x=dv.getFloat32(o,true),y=dv.getFloat32(o+4,true),z=dv.getFloat32(o+8,true);
    x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);z0=Math.min(z0,z);z1=Math.max(z1,z);
  }
  const sc=PW/(x1-x0),sy=PH/(z1-z0),cx=(x0+x1)/2,cz=(z0+z1)/2; // любая модель приводится к ширине и высоте W10 (деформация допустима)
  const fl=Math.abs(y1)<Math.abs(y0); // плоская задняя сторона у y≈0; если она сверху — поворачиваем модель на 180°
  const pos=new Float32Array(n*9),fn=new Float32Array(n*3);
  for(let t=0;t<n;t++){
    const o=84+t*50;
    for(let k=0;k<3;k++){
      const x=dv.getFloat32(o+12+k*12,true),y=dv.getFloat32(o+16+k*12,true),z=dv.getFloat32(o+20+k*12,true);
      pos[t*9+k*3]=(fl?-(x-cx):(x-cx))*sc;
      pos[t*9+k*3+1]=(z-cz)*sy;
      pos[t*9+k*3+2]=(fl?(y1-y):(y-y0))*sc+WT/2;
    }
    const a=pos.subarray(t*9,t*9+3),b=pos.subarray(t*9+3,t*9+6),c=pos.subarray(t*9+6,t*9+9);
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,l=Math.hypot(nx,ny,nz)||1;
    fn[t*3]=nx/l;fn[t*3+1]=ny/l;fn[t*3+2]=nz/l;
  }
  const key=(i)=>Math.round(pos[i]*2000)+','+Math.round(pos[i+1]*2000)+','+Math.round(pos[i+2]*2000);
  const map=new Map();
  for(let t=0;t<n;t++)for(let k=0;k<3;k++){const kk=key(t*9+k*3);let l=map.get(kk);if(!l){l=[];map.set(kk,l)}l.push(t)}
  const normals=new Float32Array(n*9),cosT=Math.cos(35*Math.PI/180);
  for(let t=0;t<n;t++)for(let k=0;k<3;k++){
    let sx=0,sy=0,sz=0;
    for(const q of map.get(key(t*9+k*3))){
      const d=fn[t*3]*fn[q*3]+fn[t*3+1]*fn[q*3+1]+fn[t*3+2]*fn[q*3+2];
      if(d>cosT){sx+=fn[q*3];sy+=fn[q*3+1];sz+=fn[q*3+2]}
    }
    const l=Math.hypot(sx,sy,sz)||1;
    normals.set([sx/l,sy/l,sz/l],t*9+k*3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(normals,3));
  g.userData.h=PH;
  return g;
}
const panMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4,side:THREE.DoubleSide});
const panel=new THREE.Mesh(buildPanel(STL_B64.m),panMat);
panel.castShadow=true;panel.receiveShadow=false;scene.add(panel);
let LD=30;
// все модели приводятся к одной ширине (как W10); стена подгоняется: в 2 раза больше панели по высоте
function fit(g){
  const wh=2*g.userData.h,s=wh/WH;
  wall.scale.y=s;floor.position.y=-wh/2;
  dist=24*s;LD=30*s;
  const c=dl.shadow.camera;c.left=-16*s;c.right=16*s;c.top=16*s;c.bottom=-16*s;c.far=60*s;c.updateProjectionMatrix();
}

// свет
scene.add(new THREE.HemisphereLight(0xffffff,0x9a9a9e,.55));
const dl=new THREE.DirectionalLight(0xffffff,.75);
dl.position.set(-8,12,14);dl.castShadow=true;
dl.shadow.mapSize.set(4096,4096);
Object.assign(dl.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});
dl.shadow.bias=-0.0005;dl.shadow.normalBias=0.02;
scene.add(dl);

// орбита
let yaw=0.5,pitch=0.12,dist=24;
const LIGHT_OFFSET=0.45; // угол смещения света вбок (рад), >0 — влево, <0 — вправо
let drag=false,px=0,py=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
view.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;view.setPointerCapture(e.pointerId);view.style.cursor='grabbing'});
view.addEventListener('pointerup',()=>{drag=false;view.style.cursor='grab'});
view.addEventListener('pointermove',e=>{
  if(!drag)return;
  yaw=clamp(yaw-(e.clientX-px)*.006,-1.1,1.1);
  pitch=clamp(pitch+(e.clientY-py)*.004,-.05,.6);
  px=e.clientX;py=e.clientY;
});
view.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist+e.deltaY*.02,9,34)},{passive:false});
function place(){
  camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(0,0,0);
  // свет спереди от ракурса, но чуть смещён влево (со стороны, где видна торцевая грань стены), чтобы волны чётче читались
  const LY=yaw-LIGHT_OFFSET,LP=pitch+0.35;
  dl.position.set(Math.sin(LY)*Math.cos(LP)*LD,Math.sin(LP)*LD,Math.cos(LY)*Math.cos(LP)*LD);
}
function resize(){
  const w=view.clientWidth,h=view.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov=w/h<0.8?55:35;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
new ResizeObserver(resize).observe(view);
(function loop(){requestAnimationFrame(loop);place();renderer.render(scene,camera)})();
resize();

fit(panel.geometry);

// цвета
function ui(id,colors,init,apply){
  const box=document.getElementById(id);
  const inp=document.createElement('input');inp.type='color';inp.value=init;
  const sws=colors.map(c=>{
    const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;
    b.onclick=()=>set(c);box.appendChild(b);return b;
  });
  box.appendChild(inp);
  function set(c){apply(c);inp.value=c;sws.forEach(s=>s.classList.toggle('on',s.title===c))}
  inp.oninput=()=>set(inp.value);
  set(init);
}
ui('wallG',['#8b8e93','#d9d4cb','#b7c4b5','#8fa3b8','#3d4248','#c9a79a','#1f2a44'],'#8b8e93',c=>wallMat.color.set(c));
ui('panG',['#ffffff','#f0e6d2','#d8d8d8','#c9a27a','#2b2b2e','#6f8f7a','#b4543f'],'#ffffff',c=>panMat.color.set(c));
